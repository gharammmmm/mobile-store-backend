kind: wasmer.io/App.v0
name: mobile-store-backend
owner: gharammmmm
package: .
debug: true

capabilities:
  database:
    engine: mysql

jobs:
  - name: migrate-database
    trigger: post-deployment
    action:
      execute:
        command: php
        cli_args:
          - /app/artisan
          - migrate
          - --force
